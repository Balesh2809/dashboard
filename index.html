<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dropout Analytics Backend Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 p-6">

    <div class="max-w-6xl mx-auto space-y-6">
        <!-- Header -->
        <div class="flex justify-between items-center bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">Student Early Warning System</h1>
                <p class="text-sm text-slate-500">Backend Analytics & Retention Dashboard</p>
            </div>
            <button onclick="toggleModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-sm font-semibold flex items-center gap-2">
                <i class="fa-solid fa-plus"></i> Add Student Record
            </button>
        </div>

        <!-- Risk Summary Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-emerald-50 border border-emerald-200 p-4 rounded-xl flex justify-between items-center">
                <div>
                    <span class="text-xs font-bold text-emerald-800 uppercase">On Track</span>
                    <h2 class="text-2xl font-bold text-emerald-900" id="lowCount">0</h2>
                </div>
                <i class="fa-solid fa-circle-check text-emerald-500 text-2xl"></i>
            </div>
            <div class="bg-amber-50 border border-amber-200 p-4 rounded-xl flex justify-between items-center">
                <div>
                    <span class="text-xs font-bold text-amber-800 uppercase">Moderate Attention</span>
                    <h2 class="text-2xl font-bold text-amber-900" id="modCount">0</h2>
                </div>
                <i class="fa-solid fa-triangle-exclamation text-amber-500 text-2xl"></i>
            </div>
            <div class="bg-rose-50 border border-rose-200 p-4 rounded-xl flex justify-between items-center">
                <div>
                    <span class="text-xs font-bold text-rose-800 uppercase">High Dropout Risk</span>
                    <h2 class="text-2xl font-bold text-rose-900" id="highCount">0</h2>
                </div>
                <i class="fa-solid fa-circle-exclamation text-rose-500 text-2xl"></i>
            </div>
        </div>

        <!-- Student Data Table -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead class="bg-slate-50 border-b border-slate-200 text-slate-600 text-xs uppercase font-semibold">
                    <tr>
                        <th class="p-4">Student Name</th>
                        <th class="p-4">GPA</th>
                        <th class="p-4">Attendance</th>
                        <th class="p-4">Assignments</th>
                        <th class="p-4">Calculated Dropout Risk</th>
                        <th class="p-4">Status</th>
                    </tr>
                </thead>
                <tbody id="studentTableBody" class="divide-y divide-slate-100 text-sm">
                    <!-- Data populated via backend API -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Form to Add New Student -->
    <div id="addModal" class="fixed inset-0 bg-slate-900/50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 max-w-md w-full space-y-4">
            <h3 class="text-lg font-bold text-slate-900">Add Student Performance Data</h3>
            <div class="space-y-3">
                <input id="name" type="text" placeholder="Full Name" class="w-full p-2.5 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                <input id="gpa" type="number" step="0.1" max="4.0" placeholder="GPA (e.g., 3.2)" class="w-full p-2.5 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                <input id="attendance" type="number" placeholder="Attendance % (e.g., 85)" class="w-full p-2.5 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                <div class="flex gap-2">
                    <input id="submitted" type="number" placeholder="Submitted HW" class="w-1/2 p-2.5 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                    <input id="total" type="number" placeholder="Total HW" class="w-1/2 p-2.5 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="toggleModal()" class="px-4 py-2 bg-slate-100 text-slate-700 rounded-lg text-sm">Cancel</button>
                <button onclick="saveStudent()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-semibold">Save Record</button>
            </div>
        </div>
    </div>

    <script>
        async function loadStudents() {
            const res = await fetch('/api/students');
            const data = await res.json();
            
            const tbody = document.getElementById('studentTableBody');
            tbody.innerHTML = '';
            
            let low = 0, mod = 0, high = 0;

            data.forEach(s => {
                if(s.status === 'Low Risk') low++;
                if(s.status === 'Moderate Risk') mod++;
                if(s.status === 'High Risk') high++;

                const colorClass = s.color === 'red' ? 'bg-rose-100 text-rose-800' : 
                                   s.color === 'amber' ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800';

                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50">
                        <td class="p-4 font-semibold text-slate-900">${s.name}</td>
                        <td class="p-4">${s.gpa} / 4.0</td>
                        <td class="p-4">${s.attendance}%</td>
                        <td class="p-4">${s.assignments}</td>
                        <td class="p-4">
                            <div class="w-full bg-slate-200 rounded-full h-2.5 max-w-[120px] inline-block mr-2">
                                <div class="bg-${s.color}-500 h-2.5 rounded-full" style="width: ${s.risk_score}%"></div>
                            </div>
                            <span class="font-bold">${s.risk_score}%</span>
                        </td>
                        <td class="p-4">
                            <span class="px-3 py-1 rounded-full text-xs font-bold ${colorClass}">${s.status}</span>
                        </td>
                    </tr>
                `;
            });

            document.getElementById('lowCount').innerText = low;
            document.getElementById('modCount').innerText = mod;
            document.getElementById('highCount').innerText = high;
        }

        function toggleModal() {
            document.getElementById('addModal').classList.toggle('hidden');
        }

        async function saveStudent() {
            const payload = {
                name: document.getElementById('name').value,
                gpa: document.getElementById('gpa').value,
                attendance: document.getElementById('attendance').value,
                submitted: document.getElementById('submitted').value,
                total: document.getElementById('total').value
            };

            await fetch('/api/students', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            toggleModal();
            loadStudents();
        }

        loadStudents();
    </script>
</body>
</html>
